    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#fafaf8 0%,#f4f1ed 50%,#fbf9f5 100%);color:#2a2a2a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}

    .links a.primary{background:var(--red);color:#fff}
    .links a.primary:hover{background:#b5302c;transform:translateY(-2px);box-shadow:0 4px 15px rgba(212,63,58,0.3)}
    .links a.secondary{border:2px solid #e0ddd9;color:#2a2a2a}
    .links a.secondary:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
    .star{font-size:2rem;color:var(--gold);margin-bottom:1.5rem}
