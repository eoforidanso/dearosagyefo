[build]
  command = "npm run build"
  publish = "."

# Redirect API calls to your Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://your-app-name.up.railway.app/api/:splat"
  status = 200
  force = true

# Root path must serve hero page
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Handle all other client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
